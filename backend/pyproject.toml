[project]
name = "fsm-ai"
version = "0.1.0"
description = "fsm.ai - natural language to safe SQL for Fraud Success Managers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.5",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlglot>=30.29.0",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.pyrefly]
project-includes = ["src", "scripts", "evals", "tests"]
search-path = ["src", "."]
