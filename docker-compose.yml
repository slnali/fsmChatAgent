# Local Postgres only. Tests use testcontainers instead.
name: fsm-ai

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fsm_owner
      POSTGRES_PASSWORD: fsm_owner_local
      POSTGRES_DB: fsm
    ports:
      - "5432:5432"
    volumes:
      - fsm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsm_owner -d fsm"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  fsm_pgdata:
